kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-cluster
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
    image: kindest/node:v1.32.2
  - role: worker
    image: kindest/node:v1.32.2
    extraPortMappings:
      - containerPort: 30080
        hostPort: 5000
        protocol: TCP
  - role: worker
    image: kindest/node:v1.32.2
