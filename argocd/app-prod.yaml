apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hamza5839/devops-master-platform.git
    targetRevision: main
    path: charts/devops-platform
    helm:
      releaseName: prod-stack
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
