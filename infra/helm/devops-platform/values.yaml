namespace: devops-dev
environment: development

redis:
  image: redis:7.2-alpine
  port: 6379
  password: "DevSecretPassword123!"
  storage: 1Gi
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "128Mi"

counter:
  image:
    repository: ghcr.io/hamza5839/counter-service
    tag: "latest"
  port: 5001
  replicas: 1
  resources:
    requests:
      cpu: "30m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "128Mi"

gateway:
  image:
    repository: ghcr.io/hamza5839/gateway-service
    tag: "latest"
  port: 5000
  nodePort: 30081
  replicas: 1
  resources:
    requests:
      cpu: "30m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "128Mi"
