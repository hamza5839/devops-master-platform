apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hamza5839/devops-master-platform.git
    targetRevision: main
    path: infra/helm/devops-platform
    helm:
      releaseName: dev-stack
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
