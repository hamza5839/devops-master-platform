name: Lint GitOps Configs

on:
  push:
    branches:
      - main
    # ONLY trigger this when infrastructure files change
    paths:
      - 'charts/**'
      - 'k8s/**'
      - 'argocd/**'

jobs:
  audit-helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Helm Lint
        # This scans your chart and values files for syntax errors
        run: helm lint charts/devops-platform/