apiVersion: v1
kind: Namespace
metadata:
  name: devops-platform
  labels:
    name: devops-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: devops-platform
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  COUNTER_URL: "http://counter-service:5001/count"
  APP_ENV: "kubernetes-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: devops-platform
type: Opaque
stringData:
  REDIS_PASSWORD: "DevOpsSecretPass123!" # gitleaks:allow
