name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-lint:
    name: Static Analysis & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for Gitleaks to scan full commit history

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Hadolint Dockerfile Linter
        uses: jessestuart/hadolint-action@v1
        with:
          dockerfile: ./services/gateway/Dockerfile

      - name: Run Hadolint on Counter Dockerfile
        uses: jessestuart/hadolint-action@v1
        with:
          dockerfile: ./services/counter/Dockerfile

  build-and-scan:
    name: Build & Trivy Vulnerability Scan
    needs: security-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway
          file: ./services/gateway/Dockerfile
          load: true
          tags: gateway-service:latest

      - name: Build Counter Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/counter
          file: ./services/counter/Dockerfile
          load: true
          tags: counter-service:latest

      - name: Run Trivy Vulnerability Scanner (Gateway)
        uses: aquasecurity/trivy-action@0.18.0
        with:
          image-ref: 'gateway-service:latest'
          format: 'table'
          exit-code: '0'       # Set to '1' to block pipeline on high CVEs
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (Counter)
        uses: aquasecurity/trivy-action@0.18.0
        with:
          image-ref: 'counter-service:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
