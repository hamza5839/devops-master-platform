name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'infra/**'
      - 'README.md'
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-lint:
    name: Static Analysis & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Hadolint Dockerfile Linter (Gateway)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./services/gateway/Dockerfile

      - name: Run Hadolint Dockerfile Linter (Counter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./services/counter/Dockerfile

  build-and-scan:
    name: Build, Trivy Scan & Push to GHCR
    needs: security-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repo Owner and Short SHA
        run: |
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway
          file: ./services/gateway/Dockerfile
          load: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/gateway-service:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ env.REPO_OWNER }}/gateway-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Counter Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/counter
          file: ./services/counter/Dockerfile
          load: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/counter-service:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ env.REPO_OWNER }}/counter-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (Gateway)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.REPO_OWNER }}/gateway-service:sha-${{ env.SHORT_SHA }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (Counter)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.REPO_OWNER }}/counter-service:sha-${{ env.SHORT_SHA }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Verified Images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ env.REPO_OWNER }}/gateway-service:sha-${{ env.SHORT_SHA }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/gateway-service:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/counter-service:sha-${{ env.SHORT_SHA }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/counter-service:latest
