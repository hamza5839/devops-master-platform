apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-stack
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: counter=ghcr.io/hamza5839/counter-service,gateway=ghcr.io/hamza5839/gateway-service
    argocd-image-updater.argoproj.io/counter.update-strategy: latest
    argocd-image-updater.argoproj.io/gateway.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/hamza5839/devops-master-platform.git
    targetRevision: main
    path: path: infra/helm/devops-platform
    helm:
      releaseName: prod-stack
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
