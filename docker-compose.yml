services:
  redis:
    image: redis:7.2-alpine
    container_name: redis-db
    command: redis-server --requirepass DevOpsSecretPass123! --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "DevOpsSecretPass123!", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  counter-service:
    build: ./services/counter
    container_name: counter-app
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=DevOpsSecretPass123!
      - APP_ENV=local-docker-compose
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  gateway-service:
    build: ./services/gateway
    container_name: gateway-app
    ports:
      - "5000:5000"
    environment:
      - COUNTER_URL=http://counter-service:5001/count
      - APP_ENV=local-docker-compose
    depends_on:
      - counter-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
    driver: local