apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-project
  namespace: argocd
spec:
  description: Restricted project for Dev environment workloads
  sourceRepos:
    - https://github.com/hamza5839/devops-master-platform.git
  destinations:
    - namespace: devops-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace